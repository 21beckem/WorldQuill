<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorldQuill Preview</title>
    <style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
}
    </style>
</head>
<body>
    
    <script type="module">
import { WorldQuill } from './javascript/WorldQuill.js';
let data = window.location.hash || null;
if (data)
    data = JSON.parse(decodeURIComponent(data.slice(1)));

console.log('data', data);

WorldQuill.init({
    worldData: data || null,
    preview: true
});

WorldQuill.onSave = function(worldData) {
    localStorage.setItem('worldData', JSON.stringify(worldData));
};
    </script>
</body>
</html>
